<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نَماء - منصة التواصل والدعم</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f9fafb;
      color: #1f2937;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1, h2, h3 {
      text-align: center;
      color: #111827;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #059669;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>منصة نَماء</h1>
    <p style="text-align: center;">أهلاً بك في منصة نَماء. يسعدنا تواصلك معنا دائماً.</p>

    <!-- نموذج الدعم الفني -->
    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e5e7eb;">
      <h3>التواصل مع الدعم الفني</h3>
      
      <div class="form-group">
        <label for="suppName">الاسم:</label>
        <input type="text" id="suppName" placeholder="أدخل اسمك الكريم" />
      </div>

      <div class="form-group">
        <label for="suppEmail">البريد الإلكتروني:</label>
        <input type="email" id="suppEmail" placeholder="example@domain.com" />
      </div>

      <div class="form-group">
        <label for="suppMsg">تفاصيل المشكلة أو الاستفسار:</label>
        <textarea id="suppMsg" rows="4" placeholder="اكتب رسالتك هنا..."></textarea>
      </div>

      <button type="button" onclick="handleSupportSubmit()">إرسال الرسالة</button>
    </div>
  </div>

  <!-- سكربت الربط مع Firebase والدعم الفني -->
  <script type="module">
    import { db } from "./firebase.js";
    import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    async function sendSupportMessage(name, email, message) {
      try {
        await addDoc(collection(db, "support_tickets"), {
          name: name,
          email: email,
          message: message,
          createdAt: serverTimestamp(),
          status: "new"
        });
        alert("تم إرسال رسالتك بنجاح! سيتواصل معك فريق الدعم قريباً.");
        
        // تفريغ الحقول بعد الإرسال
        document.getElementById('suppName').value = '';
        document.getElementById('suppEmail').value = '';
        document.getElementById('suppMsg').value = '';
      } catch (error) {
        console.error("خطأ في إرسال الرسالة: ", error);
        alert("حدث خطأ أثناء إرسال الرسالة، يرجى المحاولة لاحقاً.");
      }
    }

    window.sendSupportMessage = sendSupportMessage;
  </script>

  <script>
    function handleSupportSubmit() {
      const name = document.getElementById('suppName').value.trim();
      const email = document.getElementById('suppEmail').value.trim();
      const msg = document.getElementById('suppMsg').value.trim();

      if(!name || !email || !msg) {
        alert("يرجى تعبئة جميع الحقول قبل الإرسال");
        return;
      }

      if (window.sendSupportMessage) {
        window.sendSupportMessage(name, email, msg);
      } else {
        alert("جاري تحميل النظام، يرجى المحاولة بعد لحظات");
      }
    }
  </script>

  <script type="module" src="./firebase.js"></script>
</body>
</html>
